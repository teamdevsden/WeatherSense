services:
  - type: web
    name: weathersense-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        value: https://weathersense-628u.onrender.com
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard (your Atlas URI)
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: CLIENT_URL
        value: https://weathersense-frontend.vercel.app
    healthCheckPath: /api/health
